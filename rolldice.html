<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Roll the Dice Game</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --bg: #eef2ff;
    --card: #ffffff;
    --text: #222;
    --primary: #6366f1;
    --secondary: #8b5cf6;
    --box: #f4f4f5;
}

body.dark {
    --bg: #111827;
    --card: #1f2937;
    --text: #ffffff;
    --box: #374151;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, var(--primary), var(--secondary));
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    transition: 0.4s;
}

.game {
    width: 950px;
    max-width: 100%;
    background: var(--card);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.3);
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 25px;
}

.header h1 {
    font-size: 32px;
}

.header p {
    margin-top: 5px;
    opacity: 0.7;
}

.theme-btn {
    border: none;
    background: var(--box);
    padding: 12px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
}

/* Game Settings */

.settings {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.setting {
    background: var(--box);
    padding: 15px;
    border-radius: 15px;
}

.setting label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

select {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* Players */

.players {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 20px 0;
}

.player {
    text-align: center;
    padding: 20px;
    border-radius: 20px;
    background: var(--box);
    border: 3px solid transparent;
}

.player.active {
    border-color: var(--primary);
    transform: scale(1.02);
}

.player h2 {
    margin-bottom: 10px;
}

.score {
    font-size: 40px;
    font-weight: bold;
    color: var(--primary);
}

.turn {
    margin-top: 5px;
    font-weight: bold;
}

/* Dice */

.dice-area {
    display: flex;
    justify-content: center;
    margin: 25px;
}

.dice {
    width: 160px;
    height: 160px;

    display: flex;
    justify-content: center;
    align-items: center;

    background: white;
    color: #111;

    border-radius: 25px;

    font-size: 105px;

    box-shadow:
        0 20px 35px rgba(0,0,0,0.25);

    border: 5px solid var(--primary);
}

.rolling {
    animation: diceRoll 0.7s ease;
}

@keyframes diceRoll {
    0% {
        transform: rotate(0deg) scale(1);
    }

    25% {
        transform: rotate(90deg) scale(1.15);
    }

    50% {
        transform: rotate(180deg) scale(0.9);
    }

    75% {
        transform: rotate(270deg) scale(1.15);
    }

    100% {
        transform: rotate(360deg) scale(1);
    }
}

/* Buttons */

.buttons {
    text-align: center;
}

button {
    border: none;
    padding: 13px 25px;
    margin: 5px;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    font-size: 15px;
    transition: 0.3s;
}

.roll {
    background: var(--primary);
    color: white;
}

.new-game {
    background: #ef4444;
    color: white;
}

button:hover {
    transform: translateY(-3px);
    opacity: 0.9;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Statistics */

.statistics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-top: 25px;
}

.stat {
    background: var(--box);
    padding: 15px;
    border-radius: 15px;
    text-align: center;
}

.stat h3 {
    font-size: 13px;
    opacity: 0.7;
}

.stat p {
    margin-top: 5px;
    font-size: 24px;
    font-weight: bold;
    color: var(--primary);
}

/* Progress */

.progress-container {
    margin-top: 20px;
}

.progress-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 7px;
}

.progress {
    height: 12px;
    background: #ddd;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--primary), var(--secondary));
    transition: 0.5s;
}

/* History */

.history {
    margin-top: 25px;
}

.history h2 {
    margin-bottom: 10px;
}

.history-list {
    max-height: 150px;
    overflow-y: auto;
}

.history-list div {
    background: var(--box);
    margin: 5px 0;
    padding: 9px;
    border-radius: 8px;
}

/* Achievement */

.achievement {
    margin-top: 20px;
    padding: 15px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: white;
    border-radius: 15px;
    text-align: center;
    font-weight: bold;
}

/* Winner */

.winner {
    display: none;
    margin: 20px 0;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    background: #22c55e;
    color: white;
    font-size: 25px;
    font-weight: bold;
    animation: winnerAnimation 0.7s infinite alternate;
}

@keyframes winnerAnimation {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.04);
    }
}

/* Responsive */

@media(max-width: 700px) {

    .settings {
        grid-template-columns: 1fr;
    }

    .players {
        grid-template-columns: 1fr;
    }

    .statistics {
        grid-template-columns: repeat(2, 1fr);
    }

    .header h1 {
        font-size: 24px;
    }

    .dice {
        width: 130px;
        height: 130px;
        font-size: 85px;
    }
}
</style>

</head>

<body>

</div>

<script>

/* ==============================
   GAME VARIABLES
============================== */

const diceFaces = [
    "⚀",
    "⚁",
    "⚂",
    "⚃",
    "⚄",
    "⚅"
];

let player1Score = 0;
let player2Score = 0;

let currentPlayer = 1;

let totalRolls = 0;
let highestRoll = 0;
let currentStreak = 0;

let gameOver = false;


/* ==============================
   ELEMENTS
============================== */

const dice =
    document.getElementById("dice");

const result =
    document.getElementById("result");

const rollButton =
    document.getElementById("rollButton");

const winner =
    document.getElementById("winner");

const historyList =
    document.getElementById("historyList");


/* ==============================
   UPDATE TARGET
============================== */

document
    .getElementById("targetScore")
    .addEventListener("change", function() {

        document.getElementById("targetDisplay")
            .textContent = this.value;

        updateProgress();

    });


/* ==============================
   ROLL DICE
============================== */

function rollDice() {

    if (gameOver) {
        return;
    }

    rollButton.disabled = true;

    dice.classList.remove("rolling");

    void dice.offsetWidth;

    dice.classList.add("rolling");


    // Random number 1-6

    const randomNumber =
        Math.floor(Math.random() * 6) + 1;


    setTimeout(function() {

        dice.textContent =
            diceFaces[randomNumber - 1];

        result.textContent =
            randomNumber;


        /* Total rolls */

        totalRolls++;

        document.getElementById("totalRolls")
            .textContent = totalRolls;


        /* Highest roll */

        if (randomNumber > highestRoll) {

            highestRoll = randomNumber;

            document.getElementById("highestRoll")
                .textContent = highestRoll;

        }


        /* Streak */

        if (randomNumber >= 4) {

            currentStreak++;

        } else {

            currentStreak = 0;

        }

        document.getElementById("streak")
            .textContent = currentStreak;


        /* Score */

        if (currentPlayer === 1) {

            player1Score += randomNumber;

            document.getElementById("score1")
                .textContent = player1Score;

        } else {

            player2Score += randomNumber;

            document.getElementById("score2")
                .textContent = player2Score;

        }


        /* History */

        const item =
            document.createElement("div");

        item.textContent =
            "Player " +
            currentPlayer +
            " rolled 🎲 " +
            randomNumber;

        historyList.prepend(item);


        /* Achievement */

        updateAchievement(randomNumber);


        /* Check winner */

        checkWinner();


        if (!gameOver) {

            /* Change player */

            if (
                document.getElementById("gameMode")
                    .value === "two"
            ) {

                currentPlayer =
                    currentPlayer === 1 ? 2 : 1;

            }


            updatePlayers();

        }


        rollButton.disabled = false;

    }, 700);

}


/* ==============================
   UPDATE PLAYER TURN
============================== */

function updatePlayers() {

    const p1 =
        document.getElementById("player1");

    const p2 =
        document.getElementById("player2");

    const t1 =
        document.getElementById("turn1");

    const t2 =
        document.getElementById("turn2");


    p1.classList.remove("active");
    p2.classList.remove("active");


    if (currentPlayer === 1) {

        p1.classList.add("active");

        t1.textContent = "Your Turn";
        t2.textContent = "Waiting";

    } else {

        p2.classList.add("active");

        t2.textContent = "Your Turn";
        t1.textContent = "Waiting";

    }


    updateProgress();

}


/* ==============================
   CHECK WINNER
============================== */

function checkWinner() {

    const target =
        Number(
            document.getElementById("targetScore")
                .value
        );


    if (player1Score >= target) {

        showWinner("🎉 Player 1 Wins!");

    }


    else if (
        document.getElementById("gameMode").value === "two"
        &&
        player2Score >= target
    ) {

        showWinner("🎉 Player 2 Wins!");

    }

}


/* ==============================
   WINNER
============================== */

function showWinner(message) {

    gameOver = true;

    winner.textContent = message;

    winner.style.display = "block";

    rollButton.disabled = true;

}


/* ==============================
   PROGRESS
============================== */

function updateProgress() {

    const target =
        Number(
            document.getElementById("targetScore")
                .value
        );


    const percentage =
        Math.min(
            (player1Score / target) * 100,
            100
        );


    document.getElementById("progressBar")
        .style.width = percentage + "%";


    document.getElementById("progressText")
        .textContent =
        player1Score + " / " + target;

}


/* ==============================
   ACHIEVEMENTS
============================== */

function updateAchievement(number) {

    const achievement =
        document.getElementById("achievement");


    if (number === 6) {

        achievement.textContent =
            "🔥 Achievement Unlocked: Perfect Roll! You rolled a 6!";

    }

    else if (currentStreak >= 3) {

        achievement.textContent =
            "🔥 Amazing! You have a " +
            currentStreak +
            " roll streak!";

    }

    else if (totalRolls === 1) {

        achievement.textContent =
            "🏅 Achievement Unlocked: First Roll!";

    }

    else if (totalRolls >= 10) {

        achievement.textContent =
            "🏆 Achievement: Dice Master! 10+ rolls!";

    }

}


/* ==============================
   NEW GAME
============================== */

function newGame() {

    player1Score = 0;
    player2Score = 0;

    currentPlayer = 1;

    totalRolls = 0;
    highestRoll = 0;
    currentStreak = 0;

    gameOver = false;


    dice.textContent = "⚀";

    result.textContent = "1";


    document.getElementById("score1")
        .textContent = "0";

    document.getElementById("score2")
        .textContent = "0";

    document.getElementById("totalRolls")
        .textContent = "0";

    document.getElementById("highestRoll")
        .textContent = "0";

    document.getElementById("streak")
        .textContent = "0";


    historyList.innerHTML = "";


    winner.style.display = "none";


    document.getElementById("achievement")
        .textContent =
        "🏅 Achievement: Roll your first dice!";


    rollButton.disabled = false;


    updatePlayers();

    updateProgress();

}


/* ==============================
   CHANGE GAME MODE
============================== */

function changeMode() {

    newGame();


    const mode =
        document.getElementById("gameMode")
            .value;


    if (mode === "single") {

        document.getElementById("player2")
            .querySelector("h2")
            .textContent = "🤖 Computer";

    }

    else {

        document.getElementById("player2")
            .querySelector("h2")
            .textContent = "👤 Player 2";

    }

}


/* ==============================
   DARK / LIGHT MODE
============================== */

function toggleTheme() {

    document.body.classList.toggle("dark");

}


/* ==============================
   KEYBOARD SUPPORT
============================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.code === "Space") {

            event.preventDefault();

            if (!rollButton.disabled) {

                rollDice();

            }

        }

    }
);


/* ==============================
   INITIALIZE
============================== */

updatePlayers();

updateProgress();

</script>

</body>
</html>
